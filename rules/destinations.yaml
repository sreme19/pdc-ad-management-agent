# Destination registry — machine-readable, enforced by `ad-agent propose`
#
# This is the only rule file the CLI reads directly (every other file under
# rules/ is read live by a skill), because it backs a hard gate: propose
# REFUSES to write a record whose ad-set audience doesn't match the framing of
# the page it sends traffic to.
#
# Why it exists: on 2026-08-24 a review of the first live Snap/Meta lead
# campaigns found 98% of lead-form submissions and 100% of /get -> Play Store
# taps were men. Part of that is creative (see rules/creative-generation.md
# section 1), but the destination is the harder blocker — /get is written
# entirely in the second person to a man ("She asked how you spend your
# weekends", "2 left -> then she sees you", "Never a ranking against men he
# cannot see"). A woman who taps a women's ad lands on a page explaining how a
# man gets in front of her.
#
# How the gate opens: build the woman-facing destination, then add it here with
# audience: women. Editing this file is the intended and only way to unblock a
# blocked proposal — there is deliberately no --force flag, because an override
# flag would make the gate advisory and this one is meant to hold.
#
# `audience`     men | women | neutral — whose point of view the page's copy
#                occupies. `neutral` matches any ad set.
# `paid_traffic` false means the page cannot receive paid traffic at all
#                (e.g. token-gated), regardless of audience match.
# `verified`     the date someone actually read the page's copy to classify it.
#                Re-read and re-date it when the page changes.

destinations:
  /get:
    audience: men
    paid_traffic: true
    verified: 2026-08-24
    note: >-
      Second person is the man on every line; she is third person throughout.
      Currently the only public destination carrying the tracking.md UTM scheme.
      Needs either a women's variant switched off a UTM param, or a separate
      public route, before any women-targeted ad set can point at it.

  /get/w:
    audience: women
    paid_traffic: true
    verified: 2026-08-27
    note: >-
      The women's variant of /get, built 2026-08-25 and reworked 2026-08-27. Same
      route file, audience switched off the path segment; verification is framed
      as something she receives rather than performs. Copy verified by reading the
      rendered page.
      REWORKED 2026-08-27 and re-dated per this file's own rule. Three changes.
      (1) The page no longer opens on the flood. It was written on the premise
      that her problem is volume, and lrn-2026-08-27-complaint-is-quality-not-volume
      found five creators describing the opposite — attention that is plentiful and
      worthless. It now leads "Vetted before he reaches you", which is also the
      MOVE-ON-PROPER ad's own line, so ad and page no longer change the subject
      between the tap and the scroll. (2) It has imagery for the first time: three
      AI-generated illustrations cut from plates this repo already approved,
      labelled as illustrations in the footer per compliance.md 6.2. (3) IT NOW
      CAPTURES A LEAD — WhatsApp or email, writing to marketing_leads, which had
      existed since 2026-08-15 with a dialer attached and had never been written to
      by anything. That closes the gap in lrn-2026-08-26-no-lead-capture-on-destinations
      and gives iPhone traffic somewhere to go; whether it converts or just adds
      friction is q-2026-08-26-lead-capture-conversion, still open until there is
      data. The Play tap remains the primary CTA and the form sits below it, so the
      funnel that already works was not put behind the one being tested.
      Also removed: the per-man percentages (92/78/61) the old mock showed beside
      each profile, which was a hard numeric ranking of people and is what
      compliance.md #5 forbids.
      Deployed 2026-08-25 (pocket-dating-coach d1b04182) and opened to paid traffic
      2026-08-26 after tracking.md's checks passed against the live URL: /get 200,
      /get/w 200, /get/xyz 404; her copy confirmed; the Play referrer carries
      ra_lp=get_w plus every utm_*; a real phone visit recorded a view under its
      own campaign on network=snap and joined to its tap in visitFunnel.
      Opening it also required pocket-dating-coach e9b45a83 — d1b04182 had updated
      the DB constraint and the LandingPage type but not the two beacon endpoints,
      so every view on this page was being silently discarded and every tap filed
      under /get. Views are this audience's success metric, so that would have
      spent the budget and measured a permanent zero.

  /get/w-apply:
    audience: women
    paid_traffic: true
    verified: 2026-08-29
    note: >-
      The qualification step of the women's Meta lead funnel, built and deployed
      2026-08-28 (pocket-dating-coach 1f48d8de). She fills Meta's instant form
      (first name, phone, email), and the thank-you screen sends her here carrying
      ra_lead={{lead_id}}. The page asks one question — her age band — and on an
      18+ answer tells her she is in and hands her to Play.
      AUDIENCE IS WOMEN and the copy was read on the live URL: it is written to
      her throughout, in romanised Hinglish, with no second person addressed to a
      man anywhere.
      THE 18+ GATE IS WHY THE COPY IS ALLOWED TO SAY SHE QUALIFIED. The framing the
      campaign wanted was theatrical — tell her she qualified with nothing checked
      — which is a fabricated status and a misleading-claims exposure on an ad
      account SPEC.md #10 records as claimed on a one-way route. 18+ is a real
      eligibility condition (compliance.md 6.3, both networks' dating rules), so
      the celebration is true. If the gate is ever removed the copy becomes a lie
      and this entry must be re-read, not merely re-dated.
      PAID_TRAFFIC IS FALSE AND THAT IS DELIBERATE, not an oversight. Three of
      tracking.md's four live checks pass: /get/w-apply?ra_lead=... returns 200,
      the same path with no ra_lead 307s to /get/w with its query intact (no cold
      access, so the page cannot manufacture "qualified" visitors who never
      applied), and the Play referrer carries ra_lead + ra_lp=get_w_apply plus
      every utm_ — verified against the same commit on the dev server, since the
      link is derived from the URL client-side.
      OPENED TO PAID TRAFFIC 2026-08-29 after the outstanding check closed: a real
      browser visit to the live URL fired the page-view beacon and the row was read
      back from marketing_page_views via ads_agent_ro (page=get_w_apply,
      campaign=gate_check, utm_source=fb, 2026-08-29 07:01Z). The check that bit
      /get/w — deployed page, silently discarded views — is what this verified.
      The original outstanding note is kept below for the record:
      nobody had confirmed a real arrival WRITES a row. /get/w was deployed in d1b04182 with
      the DB constraint and the LandingPage type updated but not the beacon
      endpoints, and every view was silently discarded while ads spent normally.
      The migration for this page (20260828140000) was applied to production on
      2026-08-28 and all five call sites were changed in 1f48d8de, so it should
      write — but "should" is what was believed last time. Flip this to true when
      a real visit has been seen in marketing_page_views under page=get_w_apply,
      and record who checked.
      ALSO OUTSTANDING: the Hinglish copy has not been read by a native speaker in
      the target register. That is a spend gate, not a deploy gate.
      Test rows exist under ra_lead=DEPLOYCHECK from the deploy verification and
      should be deleted from marketing_apply_gate.

  /beta:
    audience: women
    paid_traffic: false
    verified: 2026-08-24
    note: >-
      The women's invite flow, and referenced as such by a comment at
      src/routes/get/+page.svelte:19 in pocket-dating-coach. Implemented as
      /beta/[token] — invite-token-gated, so it cannot serve paid traffic even
      though its audience matches. Not a substitute for a public women's page.

  play.google.com/store/apps/details:
    audience: neutral
    paid_traffic: true
    verified: 2026-09-04
    note: >-
      The Play listing itself — the app store page, not a page of ours. Registered
      2026-09-04 for the direct-to-store Snap lead funnel
      (moveon-lead-play-w1830-snap), whose form end page hands her to the store
      instead of to /get/w-apply.
      NOTE THE KEY SHAPE: this is the first entry keyed on HOST plus path, because
      `/store/apps/details` alone is also the App Store's path shape and anyone
      else's. destinations.normalize_path keys our own hosts on the path and
      everything else on host/path, so registering this opened exactly one listing
      and not a URL pattern.
      AUDIENCE IS NEUTRAL, and the listing was read on 2026-09-04 to say so: "people
      who are serious about finding genuine connections", "compatible singles" —
      second person is the reader whatever their gender, and there is no line
      addressed to a man about her. That is the property the gate tests, and it is
      the reason a women's ad set may point here at all.
      Rated 18+ on the listing, consistent with compliance.md 6.3, and its
      verification claim ("every user goes through identity verification") is the
      approved wording from compliance.md #4 rather than an earnings claim.
      THE STORE CANNOT BE INSTRUMENTED THE WAY OUR OWN PAGES CAN. There is no page
      view, no beacon and no marketing_page_views row from a store arrival — the
      only signal that survives is Play's install referrer, so an ad pointing here
      MUST build that referrer itself (cli._end_page_url does). An ad that sends a
      bare listing URL here produces installs nothing can attribute, which is the
      2026-08-21 incident with a different first step.
      OPENED TO META TRAFFIC 2026-09-06 for rec-2026-09-06-moveon-play-w1830-meta,
      and re-read on that date rather than merely re-dated: the listing is
      unchanged in audience (still second person to the reader whatever their
      gender) and still rated 18+. Confirmed by loading it in a browser — title
      "riteangle: Pehle Tum, Phir Koi", Rated for 18+, Install available.
      TWO THINGS THE META ARM ADDED, both in rules/tracking.md rather than here.
      (1) The ad may point at the localised storefront
      (…?id=com.riteangle.app&gl=IN&hl=en_IN) and it is the SAME registry entry:
      normalize_path keys on host and path, so query parameters never reach the
      key. (2) On Meta the tracking must go in the creative's own LINK, inside
      referrer= — NOT in url_tags, which Meta appends and Play discards, silently.
      Its ra_lp is meta_ad_direct, a third label distinct from snap_lead_form and
      snap_ad_direct.
      AND THE HARD LIMIT, WORTH READING BEFORE PROPOSING ANOTHER AD HERE: no pixel
      of ours can fire on this destination on any network, and Meta's
      app-promotion objective is unavailable to this account
      (lrn-2026-09-06-meta-app-promotion-blocked-no-play-url). Every ad pointed
      here therefore optimises toward a TAP, not an install. The Snap arm that ran
      this shape first produced zero installs, and that is the leading explanation.
      See q-2026-09-06-can-meta-optimise-toward-installers-not-tappers before
      committing more direct-to-store budget.
